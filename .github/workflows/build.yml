name: Build Dynamic Icon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android32
            target: Android32
            os: ubuntu-latest
          - platform: Android64
            target: Android64
            os: ubuntu-latest
          - platform: Windows
            target: Win64
            os: windows-latest
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          build-config: Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Icon-${{ matrix.platform }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
