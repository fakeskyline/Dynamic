name: Build Dynamic Icon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android32
            target: Android32
            os: ubuntu-latest
          - name: Android64
            target: Android64
            os: ubuntu-latest
          - name: Windows
            target: Win64
            os: windows-latest
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Combine and validate all platforms
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine Geode packages
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Validate universal package
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.combine.outputs.build-output }}
        run: |
          set -euo pipefail
          PACKAGE="$(find "$BUILD_OUTPUT" -type f -name '*.geode' -print -quit)"
          if [ -z "$PACKAGE" ]; then
            echo "::error::Combine action did not produce a .geode package"
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$PACKAGE" -d "$TEMP_DIR"

          ANDROID32="$TEMP_DIR/fakeskyline.dynamic.android32.so"
          ANDROID64="$TEMP_DIR/fakeskyline.dynamic.android64.so"
          WINDOWS="$TEMP_DIR/fakeskyline.dynamic.dll"

          for binary in "$ANDROID32" "$ANDROID64" "$WINDOWS"; do
            if [ ! -s "$binary" ]; then
              echo "::error::Missing platform binary: $(basename "$binary")"
              find "$TEMP_DIR" -maxdepth 3 -type f -print
              exit 1
            fi
          done

          readelf -h "$ANDROID32" > "$TEMP_DIR/android32.txt"
          grep -q "Class:.*ELF32" "$TEMP_DIR/android32.txt"
          grep -q "Machine:.*ARM" "$TEMP_DIR/android32.txt"

          readelf -h "$ANDROID64" > "$TEMP_DIR/android64.txt"
          grep -q "Class:.*ELF64" "$TEMP_DIR/android64.txt"
          grep -q "Machine:.*AArch64" "$TEMP_DIR/android64.txt"

          WINDOWS_INFO="$(file "$WINDOWS")"
          echo "$WINDOWS_INFO"
          echo "$WINDOWS_INFO" | grep -q "PE32+"
          echo "$WINDOWS_INFO" | grep -Eiq "x86-64|x86_64"

          echo "All platform binaries are present and have the expected architectures."
          stat -c '%n: %s bytes' "$ANDROID32" "$ANDROID64" "$WINDOWS" "$PACKAGE"

      - name: Upload universal package
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Icon-All-Platforms
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30
