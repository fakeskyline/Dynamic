name: Build Dynamic Icon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  android64:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .geode
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Icon-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
